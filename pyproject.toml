[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gensyn-audit"
version = "1.0.0"
description = "Independently replay and verify Gensyn Open 1B training steps."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Accelerates CRC32C verification; a pure-Python fallback remains available.
    "google-crc32c>=1.5",
]

[project.scripts]
gensyn-audit = "gensyn_audit.cli:main"

[project.urls]
Website = "https://open1b.gensyn.ai/"
Repository = "https://github.com/gensyn-ai/gensyn-audit"

[tool.hatch.build.targets.wheel]
packages = ["src/gensyn_audit"]
# Local mock fixtures may contain withheld loss values and must never ship.
exclude = ["src/gensyn_audit/mocks/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]

[tool.pyrefly]
project-includes = ["src/**/*.py"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
